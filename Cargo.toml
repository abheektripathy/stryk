[workspace]
resolver = "2"
members = [
    "crates/stryk-core",
    "crates/stryk-client",
    "programs/stryk",
    "apps/cli",
    "apps/service",
    "apps/web",
    "tests/fixture-receiver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
stryk-core = { path = "crates/stryk-core" }
stryk-client = { path = "crates/stryk-client" }
solana-address = { version = "=2.5.0", features = ["copy", "curve25519", "decode"] }
solana-instruction = "=3.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "37e8a6b48192cc44ab6c8b74cdd83d84c345575c" }
quasar-spl = { git = "https://github.com/blueshift-gg/quasar", rev = "37e8a6b48192cc44ab6c8b74cdd83d84c345575c" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true

[profile.dev]
debug = 0

