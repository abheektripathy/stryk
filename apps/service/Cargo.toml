[package]
name = "stryk-service"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
solana-address.workspace = true
solana-instruction.workspace = true
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
stryk-client.workspace = true
stryk-core.workspace = true
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
