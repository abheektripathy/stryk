[package]
name = "stryk-web"
version.workspace = true
edition.workspace = true

[features]
local-wallet = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
bincode = "1.3"
dioxus = { version = "0.7", default-features = false, features = ["web", "minimal", "router", "document"] }
ed25519-dalek = "2.2"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
solana-address.workspace = true
solana-instruction.workspace = true
stryk-client.workspace = true
stryk-core.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Event", "EventTarget", "Location", "Navigator", "Storage", "Window"] }
